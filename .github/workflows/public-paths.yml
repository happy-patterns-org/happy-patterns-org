# public-paths — scheduled outside check for docs/public-paths.md (rule 5 of
# Operating Rules in AGENTS.md; owner decision 2 in issue #15).
#
# Each run probes P1-P3 with tools/probe-public-paths.sh, then reports to one
# check in a heartbeat service outside GitHub. That service alarms on a failure
# report and on missing reports. Missing reports also cover GitHub being down.
#
# Routing (rule 2):
#   exit 0  all hold          -> success report
#   exit 3  drift only        -> success report + agent issue
#   exit 1  public path down  -> failure report (the service alerts the owner)
#                                + agent issue
#   exit 2  probe broken      -> no report + agent issue; the silence alarm
#                                reaches the owner only if this outlasts the grace
#
# Secrets: both are set once by the owner, both are addresses of the same check,
# and both are credentials that are never printed:
#   HEARTBEAT_URL       success report address
#   HEARTBEAT_FAIL_URL  failure report address
# If either is missing or a report cannot be delivered, the run logs a warning,
# the agent issue says no report went out, and the silence alarm is the backstop.
#
# Keepalive: GitHub disables scheduled workflows in a public repository after 60
# days without repository activity. Every scheduled run calls the workflow-enable
# endpoint from a separate job that alone holds actions: write. Common keepalive
# tools rely on that call to reset the timer; GitHub does not document it. If the schedule stops anyway, nothing
# inside GitHub can raise an issue, and the silence alarm reaches the owner
# (closing that gap is issue #18).
#
# The run stays green whatever the probe finds. GitHub emails a failed scheduled
# run to the login that last changed the cron line, which would be a second,
# unlisted owner alert. The heartbeat report and the agent issue carry the signal.

name: public-paths

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      inject_path:
        description: "Readback only: one extra page that must fail, e.g. /no-such-page.html"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: public-paths
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Probe public paths
        id: probe
        shell: bash
        env:
          PROBE_INJECT_PATH: ${{ inputs.inject_path }}
        run: |
          set +e
          sh tools/probe-public-paths.sh | tee probe.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "probe exit $rc"

      - name: Report to the heartbeat service
        id: report
        if: always()
        shell: bash
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          HEARTBEAT_FAIL_URL: ${{ secrets.HEARTBEAT_FAIL_URL }}
          RC: ${{ steps.probe.outputs.rc }}
        run: |
          case "$RC" in
            0|3) url=$HEARTBEAT_URL; name=HEARTBEAT_URL; kind=success ;;
            1) url=$HEARTBEAT_FAIL_URL; name=HEARTBEAT_FAIL_URL; kind=failure ;;
            *)
              echo "sent=none" >> "$GITHUB_OUTPUT"
              echo "no report for probe exit ${RC:-none}"
              exit 0
              ;;
          esac
          if [ -z "$url" ]; then
            echo "::warning::$name is not set; no $kind report sent"
            echo "sent=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -fsS -o /dev/null --connect-timeout 5 --max-time 15 --retry 2 --retry-delay 5 "$url"; then
            echo "sent=$kind" >> "$GITHUB_OUTPUT"
            echo "$kind report sent"
          else
            echo "::warning::the $kind report could not be delivered; the silence alarm is the backstop"
            echo "sent=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the agent issue
        if: always() && steps.probe.outputs.rc != '0' && inputs.inject_path == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.probe.outputs.rc }}
          SENT: ${{ steps.report.outputs.sent }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RC" in
            1) title="public-paths: a public path is down (exit 1)" ;;
            3) title="public-paths: drift (exit 3)" ;;
            *) title="public-paths: the probe is broken (exit ${RC:-none})" ;;
          esac
          case "$RC/$SENT" in
            1/failure) alert="A failure report was sent; the heartbeat service alerts the owner." ;;
            1/*) alert="No failure report went out (see the run's warnings), so this run alerted no one. The silence alarm fires if no success report arrives within the grace period." ;;
            3/*) alert="Drift only: the paths still serve. The owner is not alerted." ;;
            *) alert="No report was sent. The silence alarm reaches the owner only if this outlasts the grace period." ;;
          esac
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label needs-agent-action \
            --search "public-paths in:title" --limit 50 --json number,title |
            jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$open" ]; then
            echo "issue #$open is already open; see $RUN_URL"
            exit 0
          fi
          {
            echo "Probe exit ${RC:-none} at $(date -u +%Y-%m-%dT%H:%M:%SZ): $RUN_URL"
            echo
            echo "$alert"
            echo
            echo '```'
            grep -E '^(FAIL|ERROR)' probe.log || true
            echo '```'
            echo
            echo "Close this once a run shows exit 0. Later runs with the same exit do not comment while it is open."
          } > body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label needs-agent-action --body-file body.md

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/public-paths.yml/enable"
